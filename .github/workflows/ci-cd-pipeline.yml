name: CI/CD Pipeline to GCP VM

on:
  push:
    branches:
      - master  # master 브랜치에 푸시될 때
  pull_request:
    branches:
      - master  # master 브랜치로 PR이 생성될 때

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. JDK 설정
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. Maven 의존성 캐시
      - name: Cache Maven dependencies
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # 4. Maven 빌드
      - name: Build with Maven
        run: mvn clean package -DskipTests=true

      # 5. 빌드된 아티팩트 업로드
      - name: Upload build artifact
        uses: actions/upload-artifact@v2
        with:
          name: spring-boot-artifact
          path: target/*.war  # 빌드된 .war 파일

  deploy:
    runs-on: ubuntu-latest
    needs: build  # 빌드 작업이 완료된 후에 실행

    steps:
      # 1. 리포지토리 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 빌드된 아티팩트 다운로드
      - name: Download artifact
        uses: actions/download-artifact@v2
        with:
          name: spring-boot-artifact
          path: ./artifacts

      # 3. SSH 설정 (비공개 키 사용)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOMETALK_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa 34.64.199.61 >> ~/.ssh/known_hosts

      # 4. GCP VM에 애플리케이션 배포
      - name: Deploy to GCP VM
        run: |
          echo "Deploying to GCP VM..."
          scp -i ~/.ssh/id_rsa ./artifacts/*.war kia20250626@34.64.199.61:/opt/apache-tomcat-9.0.106/webapps/  # Tomcat 경로 수정
          ssh -i ~/.ssh/id_rsa kia20250626@34.64.199.61 "mv /opt/apache-tomcat-9.0.106/webapps/*.war /opt/apache-tomcat-9.0.106/webapps/ROOT.war"  # WAR 파일 이름 변경
          ssh -i ~/.ssh/id_rsa kia20250626@34.64.199.61 "sudo /opt/apache-tomcat-9.0.106/bin/shutdown.sh && sudo /opt/apache-tomcat-9.0.106/bin/startup.sh"  # Tomcat 재시작
